<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>흰 족제비 벽돌깨기</title>
<!-- 옛날 게임 느낌의 한글 도트 글꼴 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(#cfe6ff, #f4f9ff 60%, #ffffff);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; overflow: hidden; user-select: none;
    font-family: 'Galmuri11', monospace; color: #4a5a8a;
  }
  .screen {
    position: relative;
    width: min(96vw, calc(88vh * 0.8));
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;   /* 크게 키워도 도트가 또렷하게 */
    border-radius: 6px;
    box-shadow: 0 0 0 4px #ffffff, 0 0 0 7px #9ec3ee, 0 10px 30px #7fa6d955;
    touch-action: none;
    cursor: none;
  }
  /* 게임 시작 버튼 */
  #startBtn {
    position: absolute;
    left: 50%; top: 68%;
    transform: translate(-50%, -50%);
    font-family: 'Galmuri11', monospace;
    font-size: clamp(16px, 4.5vw, 24px);
    padding: 12px 28px;
    color: #fff;
    background: #ff7fb0;
    border: 3px solid #2a2350;
    border-radius: 14px;
    box-shadow: 0 5px 0 #2a2350;
    cursor: pointer;
    animation: bob 1s ease-in-out infinite;
  }
  #startBtn:hover { background: #ff9ec4; }
  #startBtn:active { box-shadow: 0 1px 0 #2a2350; margin-top: 4px; }
  #startBtn.hidden { display: none; }
  @keyframes bob { 50% { transform: translate(-50%, -58%); } }
  /* 소리 켜기/끄기 버튼 (화면 오른쪽 위 구석) */
  #soundBtn {
    position: fixed;
    top: 12px; right: 12px;
    width: 48px; height: 48px;
    font-size: 22px;
    background: #ffffff;
    border: 3px solid #2a2350;
    border-radius: 50%;
    box-shadow: 0 3px 0 #2a2350;
    cursor: pointer;
  }
  #soundBtn:active { box-shadow: 0 0 0 #2a2350; transform: translateY(3px); }
  .help { font-size: 12px; text-align: center; line-height: 1.6; padding: 0 16px; }
</style>
</head>
<body>
<button id="soundBtn" title="소리 켜기/끄기">🔊</button>
<div class="screen">
  <canvas id="game" width="320" height="400"></canvas>
  <button id="startBtn">게임 시작</button>
</div>
<div class="help">
  ← → 방향키 또는 마우스로 족제비 움직이기<br>
  P: 잠깐 멈춤 · M: 소리 끄기/켜기
</div>

<script>
// ===== 기본 설정 =====
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const startBtn = document.getElementById('startBtn');
const soundBtn = document.getElementById('soundBtn');
const W = 320, H = 400;                 // 게임 화면 크기 (작게 그리고 크게 늘려서 도트 느낌)
const LEFT = 12, RIGHT = 308, TOP = 30; // 벽 안쪽 경계
const FONT = "'Galmuri11', 'Galmuri9', monospace";
const OL = '#2a2350';                   // 테두리 색

// 벽돌: 5줄 × 8칸, 줄마다 다른 색 (눈처럼 밝은 파스텔 색)
const ROWS = 5, COLS = 8;
const ROW_COLORS = ['#ff9ec4', '#ffc48a', '#fff09a', '#9de8c0', '#9ad4ff'];
const WALL_COLORS = ['#a8d8ff', '#c7b8ff', '#ffc2dc', '#a8f0d0', '#ffe0a0']; // 레벨마다 얼음벽 색이 바뀜
const BW = 34, BH = 14, GAP_X = 2, GAP_Y = 4, BX = 17, BY = 52;

const BALL_R = 5;
const START_LIVES = 3;
const FERRET_W = 56, FERRET_LONG_W = 84; // 보통 길이, 길어졌을 때 길이
const LONG_TIME = 600;                   // 길어지는 시간 (60 = 1초, 그래서 10초)

// ===== 게임 상태 =====
let state = 'title';  // title(처음), ready(준비), play(하는 중), dead(공 놓침), clear(레벨 클리어), over(게임 오버)
let score = 0, lives = START_LIVES, level = 1, frame = 0, timer = 0;
let best = 0, newRecord = false;
// 브라우저에 저장해 둔 최고 점수 불러오기
try { best = Number(localStorage.getItem('ferretBest')) || 0; } catch (e) {}
let bricks = [], balls = [], items = [], parts = [], pops = [];
let muted = false, paused = false;
const keys = {};

const ferret = { x: W / 2, tx: W / 2, y: 362, w: FERRET_W, longT: 0, vx: 0, face: 1, squish: 0, mood: 'normal', moodT: 0, step: 0 };

// 하늘에서 내리는 눈송이
const flakes = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 0.8 + Math.random() * 1.7, s: 0.2 + Math.random() * 0.5, ph: Math.random() * 6 }));

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const rand = (a, b) => a + Math.random() * (b - a);

// 레벨이 오를수록 공이 빨라짐
const levelSpeed = () => Math.min(3 + (level - 1) * 0.4, 6);

// ===== 소리 (음악 파일 없이 브라우저가 직접 만드는 소리) =====
let ac = null, noiseBuf = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
// 삑! 하는 음
function beep(f, dur = 0.08, type = 'square', vol = 0.06, f2 = null, delay = 0) {
  if (muted || !ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
// 치익~ 하는 잡음 (눈 밟는 "사각" 소리에 사용)
function noise(dur = 0.12, vol = 0.2, freq = 2500, delay = 0) {
  if (muted || !ac) return;
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = ac.currentTime + delay, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = noiseBuf;
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(ac.destination);
  src.start(t); src.stop(t + dur + 0.02);
}
const tune = (notes, gap, type = 'square', vol = 0.05, len = 0.1) => notes.forEach((f, i) => beep(f, len, type, vol, null, i * gap));
const sfx = {
  paddle: () => beep(220, 0.14, 'sine', 0.14, 520),                    // 통! (튕길 때)
  wall:   () => beep(700, 0.04, 'triangle', 0.04),
  brick:  () => { noise(0.13, 0.25, rand(2000, 3500)); beep(pick([784, 880, 1047, 1175, 1319]), 0.12, 'triangle', 0.06); }, // 사각+띵 (깨질 때)
  item:   () => tune([784, 988, 1175, 1568], 0.06, 'square', 0.04, 0.08),
  lose:   () => tune([523, 440, 349], 0.12, 'triangle', 0.09, 0.15),
  over:   () => { tune([523, 466, 392, 330, 262], 0.2, 'triangle', 0.1, 0.25); noise(0.8, 0.08, 400, 1.0); }, // 띠로리~ (게임 오버)
  clear:  () => tune([523, 659, 784, 1047, 784, 1047], 0.09),
  start:  () => tune([392, 523, 659, 784], 0.08),
};
function toggleSound() {
  muted = !muted;
  soundBtn.textContent = muted ? '🔇' : '🔊';
  audio();
}

// ===== 게임 흐름 =====
function startGame() {
  audio();
  score = 0; lives = START_LIVES; level = 1;
  paused = false;
  startBtn.classList.add('hidden');
  buildBricks();
  readyBall();
  sfx.start();
}

function buildBricks() {
  bricks = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      bricks.push({
        x: BX + c * (BW + GAP_X), y: BY + r * (BH + GAP_Y), w: BW, h: BH,
        color: ROW_COLORS[r], blink: Math.floor(Math.random() * 240),
        drip: [rand(4, 10), rand(14, 20), rand(24, 30)],   // 눈이 흘러내린 모양 위치
      });
    }
  }
}

// 공 하나를 족제비 위에 올려놓고 잠깐 기다림
function readyBall() {
  items = [];
  balls = [{ x: ferret.x, y: ferret.y - BALL_R - 1, vx: 0, vy: 0, speed: levelSpeed(), trail: [] }];
  ferret.longT = 0;
  setMood('normal', 0);
  state = 'ready';
  timer = 60;   // 1초 뒤에 공이 출발
}

function launch() {
  const b = balls[0];
  const a = Math.random() * 0.6 - 0.3;
  b.vx = b.speed * Math.sin(a);
  b.vy = -b.speed * Math.cos(a);
  state = 'play';
}

function gameOver() {
  state = 'over';
  newRecord = score > best;
  if (newRecord) {
    // 브라우저에 저장해서 다음에 다시 열어도 남아 있음
    best = score;
    try { localStorage.setItem('ferretBest', best); } catch (e) {}
  }
  setMood('sad', 99999);
  sfx.over();
  startBtn.textContent = '다시 시작';
  startBtn.classList.remove('hidden');
  startBtn.focus();
}

function setMood(mood, t) { ferret.mood = mood; ferret.moodT = t; }

// ===== 조작 =====
startBtn.addEventListener('click', startGame);
soundBtn.addEventListener('click', () => { toggleSound(); soundBtn.blur(); });
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyP' && state !== 'title' && state !== 'over') paused = !paused;
  if (e.code === 'KeyM') toggleSound();
});
addEventListener('keyup', e => { keys[e.code] = false; });
const pointerX = clientX => { const r = cv.getBoundingClientRect(); return (clientX - r.left) * W / r.width; };
cv.addEventListener('pointermove', e => { ferret.tx = pointerX(e.clientX); });
cv.addEventListener('pointerdown', e => { ferret.tx = pointerX(e.clientX); paused = false; });
addEventListener('blur', () => { if (state === 'play') paused = true; });

// ===== 움직임 계산 =====
function update() {
  frame++;
  for (const f of flakes) {
    f.y += f.s;
    f.x += Math.sin(frame * 0.02 + f.ph) * 0.3;   // 살랑살랑
    if (f.y > H + 5) { f.y = -5; f.x = Math.random() * W; }
  }
  if (paused) return;
  updateEffects();
  if (state === 'title') return;

  moveFerret();
  if (state === 'ready') {
    balls[0].x = ferret.x;
    balls[0].y = ferret.y - BALL_R - 1;
    if (--timer <= 0) launch();
  } else if (state === 'play') {
    // 바닥으로 떨어진 공은 없애기
    balls = balls.filter(b => moveBall(b));
    if (state === 'play' && balls.length === 0) loseLife();
    updateItems();
  } else if (state === 'dead') {
    if (--timer <= 0) readyBall();
  } else if (state === 'clear') {
    updateItems();
    if (--timer <= 0) {  // 다음 레벨로!
      level++;
      buildBricks();
      readyBall();
    }
  }
}

function moveFerret() {
  if (keys.ArrowLeft) ferret.tx -= 5;
  if (keys.ArrowRight) ferret.tx += 5;

  // 초록 아이템을 먹으면 잠깐 몸이 길어짐
  if (ferret.longT > 0) ferret.longT--;
  const targetW = ferret.longT > 0 ? FERRET_LONG_W : FERRET_W;
  ferret.w += (targetW - ferret.w) * 0.2;

  const half = ferret.w / 2;
  ferret.tx = clamp(ferret.tx, LEFT + half + 20, RIGHT - half - 20);
  const old = ferret.x;
  ferret.x += clamp(ferret.tx - ferret.x, -10, 10);
  ferret.vx = ferret.x - old;
  if (Math.abs(ferret.vx) > 0.3) {
    ferret.face = Math.sign(ferret.vx);       // 움직이는 쪽을 바라봄
    ferret.step += Math.abs(ferret.vx) * 0.25; // 다리 움직임
  }
  if (ferret.squish > 0) ferret.squish--;
  if (ferret.moodT > 0 && --ferret.moodT === 0) ferret.mood = 'normal';
}

// 공 하나 움직이기. 바닥에 떨어지면 false를 돌려줌
function moveBall(ball) {
  const R = BALL_R;
  // 빠를 때 벽돌을 뚫고 지나가지 않도록 여러 번 나눠서 움직임
  const steps = Math.ceil(ball.speed / 2);
  for (let i = 0; i < steps; i++) {
    ball.x += ball.vx / steps;
    ball.y += ball.vy / steps;

    // 벽에 튕기기
    if (ball.x - R < LEFT)  { ball.x = LEFT + R;  ball.vx = Math.abs(ball.vx);  sfx.wall(); }
    if (ball.x + R > RIGHT) { ball.x = RIGHT - R; ball.vx = -Math.abs(ball.vx); sfx.wall(); }
    if (ball.y - R < TOP)   { ball.y = TOP + R;   ball.vy = Math.abs(ball.vy);  sfx.wall(); }

    // 족제비 등에 튕기기 (맞은 위치에 따라 튀는 방향이 달라짐)
    const half = ferret.w / 2 + 6;
    if (ball.vy > 0 && ball.y + R >= ferret.y && ball.y + R <= ferret.y + 10 && Math.abs(ball.x - ferret.x) <= half + R) {
      const rel = clamp((ball.x - ferret.x) / half, -1, 1);
      const ang = rel * Math.PI / 3;
      ball.speed = Math.min(ball.speed + 0.05, levelSpeed() + 1.5);
      ball.vx = ball.speed * Math.sin(ang);
      ball.vy = -ball.speed * Math.cos(ang);
      ball.y = ferret.y - R;
      ferret.squish = 8;
      sfx.paddle();
    }

    // 벽돌에 부딪히기
    for (const b of bricks) {
      const cx = clamp(ball.x, b.x, b.x + b.w), cy = clamp(ball.y, b.y, b.y + b.h);
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > R * R) continue;
      // 더 조금 겹친 쪽으로 튕겨냄
      const ox = Math.min(ball.x + R - b.x, b.x + b.w - (ball.x - R));
      const oy = Math.min(ball.y + R - b.y, b.y + b.h - (ball.y - R));
      if (ox < oy) ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      else         ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      hitBrick(b);
      break;
    }
    if (state !== 'play') return true;

    // 바닥으로 떨어짐
    if (ball.y - R > H) {
      snowBurst(clamp(ball.x, LEFT + 10, RIGHT - 10), H - 16, null);
      return false;
    }
  }

  // 공이 너무 옆으로만 가지 않게 살짝 고쳐줌
  const minVy = ball.speed * 0.3;
  if (Math.abs(ball.vy) < minVy) {
    ball.vy = (Math.sign(ball.vy) || -1) * minVy;
    ball.vx = (Math.sign(ball.vx) || 1) * Math.sqrt(ball.speed ** 2 - minVy ** 2);
  }

  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 6) ball.trail.shift();
  return true;
}

// 공이 하나도 안 남으면 목숨이 하나 줄어듦
function loseLife() {
  lives--;
  items = [];
  if (lives <= 0) { gameOver(); return; }
  state = 'dead';
  timer = 70;
  setMood('sad', 70);
  sfx.lose();
}

function hitBrick(b) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  bricks.splice(bricks.indexOf(b), 1);
  score += 10;
  sfx.brick();
  snowBurst(cx, cy, b.color);

  // 10% 확률로 아이템이 떨어짐 (초록: 길어짐 / 노랑: 공 추가)
  if (Math.random() < 0.1) items.push({ x: cx, y: cy, type: pick(['long', 'multi']), t: 0 });

  // 벽돌을 다 깨면 레벨 클리어
  if (bricks.length === 0) {
    state = 'clear';
    timer = 120;
    setMood('happy', 120);
    for (let i = 0; i < 8; i++) snowBurst(rand(40, 280), rand(60, 180), pick(ROW_COLORS));
    sfx.clear();
  }
}

function updateItems() {
  for (const it of items) {
    it.y += 1.5;
    it.t++;
    const caught = it.y + 7 >= ferret.y - 6 && it.y - 7 <= ferret.y + 14 && Math.abs(it.x - ferret.x) < ferret.w / 2 + 10;
    if (caught) {
      it.dead = true;
      if (it.type === 'long') {
        ferret.longT = LONG_TIME;
        pops.push({ x: ferret.x, y: ferret.y - 16, text: '길어졌다!', life: 60, color: '#7ee07e' });
      } else {
        addBalls();
        pops.push({ x: ferret.x, y: ferret.y - 16, text: '공 추가!', life: 60, color: '#ffe35c' });
      }
      setMood('happy', 40);
      sfx.item();
    }
    if (it.y > H + 10) it.dead = true;
  }
  items = items.filter(it => !it.dead);
}

// 공 하나에서 새 공 두 개가 양옆으로 갈라져 나옴
function addBalls() {
  if (state !== 'play' || balls.length === 0) return;
  const src = balls[0];
  const dir = Math.atan2(src.vx, -src.vy);
  for (const k of [-0.5, 0.5]) {
    balls.push({
      x: src.x, y: src.y, speed: src.speed, trail: [],
      vx: src.speed * Math.sin(dir + k), vy: -src.speed * Math.cos(dir + k),
    });
  }
}

// 벽돌 위에 쌓인 눈이 와르르 흩어지는 효과
function snowBurst(x, y, color) {
  // 눈 덩어리 조각 (톡 튀었다가 떨어짐)
  for (let i = 0; i < 14; i++) {
    parts.push({
      x: x + rand(-14, 14), y: y - 5 + rand(-2, 2),
      vx: rand(-1.4, 1.4), vy: rand(-2.4, -0.4), g: 0.12,
      life: rand(35, 55), size: pick([1, 2, 2, 3]), color: pick(['#ffffff', '#f2f8ff', '#e3eefc']), snow: true,
    });
  }
  // 깨진 벽돌 색 조각
  if (color) {
    for (let i = 0; i < 5; i++) {
      parts.push({ x, y, vx: rand(-1.5, 1.5), vy: rand(-2, -0.5), g: 0.15, life: 30, size: 2, color });
    }
  }
  // 천천히 날리는 가루눈
  for (let i = 0; i < 5; i++) {
    parts.push({ x: x + rand(-10, 10), y, vx: rand(-0.4, 0.4), vy: rand(-0.6, 0), g: 0.01, life: rand(60, 90), size: rand(1, 1.8), flake: true });
  }
}

function updateEffects() {
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--;
    if (p.flake) p.x += Math.sin((frame + p.life) * 0.1) * 0.2;
  }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.y -= 0.5; p.life--; }
  pops = pops.filter(p => p.life > 0);
}

// ===== 그리기 도우미 =====
function rr(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}
function circle(x, y, r, fill, stroke) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}
function oval(x, y, rx, ry, fill, stroke) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}
function poly(points, fill) {
  ctx.beginPath();
  ctx.moveTo(points[0], points[1]);
  for (let i = 2; i < points.length; i += 2) ctx.lineTo(points[i], points[i + 1]);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}
function heart(x, y, s, color) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.7, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.7, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.9);
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = OL; ctx.stroke();
}
function text(s, x, y, size = 11, color = '#fff', align = 'center') {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = size > 20 ? 5 : 3;
  ctx.strokeStyle = OL;
  ctx.strokeText(s, x, y);
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
// 글자마다 색이 다르고 통통 튀는 글씨 (버블버블 느낌)
function rainbow(s, x, y, size = 22) {
  const cols = ['#ff8fc8', '#ffe35c', '#7ee07e', '#6ec8ff', '#b28dff', '#ffb347'];
  ctx.font = `${size}px ${FONT}`;
  const chars = [...s];
  const total = chars.reduce((sum, c) => sum + ctx.measureText(c).width, 0);
  let cx = x - total / 2;
  chars.forEach((c, i) => {
    const wc = ctx.measureText(c).width;
    text(c, cx + wc / 2, y + Math.sin(frame * 0.12 + i * 0.7) * 2, size, cols[i % cols.length]);
    cx += wc;
  });
}

// ===== 설산 배경 (움직이지 않으니 처음에 한 번만 그려 둠) =====
const bgCanvas = document.createElement('canvas');
bgCanvas.width = W; bgCanvas.height = H;
(function drawSnowMountains() {
  const b = bgCanvas.getContext('2d');
  const tri = (pts, fill) => {
    b.beginPath(); b.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) b.lineTo(pts[i], pts[i + 1]);
    b.closePath(); b.fillStyle = fill; b.fill();
  };
  // 산 하나: 햇빛 받는 쪽은 밝게, 반대쪽은 살짝 푸르게, 꼭대기엔 하얀 눈
  const mountain = (px, py, w, lit, shade) => {
    tri([px - w, H, px, py, px, H], lit);
    tri([px, py, px + w, H, px, H], shade);
    const ch = (H - py) * 0.22, cw = w * 0.22;
    tri([px, py, px + cw, py + ch, px + cw * 0.35, py + ch * 0.8, px, py + ch * 1.1, px - cw * 0.45, py + ch * 0.75, px - cw, py + ch], '#ffffff');
  };

  // 하늘
  const sky = b.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#7fb2e6');
  sky.addColorStop(0.55, '#cfe4fa');
  sky.addColorStop(1, '#eef6ff');
  b.fillStyle = sky; b.fillRect(0, 0, W, H);

  // 해
  const sun = b.createRadialGradient(250, 120, 2, 250, 120, 40);
  sun.addColorStop(0, 'rgba(255,255,240,0.95)');
  sun.addColorStop(1, 'rgba(255,255,240,0)');
  b.fillStyle = sun; b.fillRect(200, 70, 100, 100);

  // 멀리 있는 산
  [[40, 170, 90], [130, 150, 100], [220, 180, 90], [300, 160, 90]].forEach(([x, y, w]) => mountain(x, y, w, '#dce9f9', '#b9cfee'));
  // 가까운 산
  [[0, 230, 90], [95, 205, 100], [200, 240, 90], [290, 215, 100]].forEach(([x, y, w]) => mountain(x, y, w, '#ffffff', '#d3e2f6'));

  // 눈 덮인 소나무
  [[30, 352, 1], [58, 360, 0.7], [262, 350, 1], [290, 358, 0.8], [150, 366, 0.6]].forEach(([x, y, s]) => {
    b.fillStyle = '#6b4a3a'; b.fillRect(x - 1, y, 3, 8 * s);
    for (let k = 0; k < 3; k++) {
      const ty = y - k * 9 * s, tw = (12 - k * 3) * s;
      tri([x - tw, ty, x, ty - 12 * s, x + tw, ty], '#4f8f86');
      tri([x - tw * 0.5, ty - 6 * s, x, ty - 12 * s, x + tw * 0.5, ty - 6 * s], '#ffffff');
    }
  });

  // 눈 쌓인 땅
  b.fillStyle = '#ffffff';
  for (let x = -10; x < W + 20; x += 34) {
    b.beginPath(); b.ellipse(x, 386, 26, 10, 0, 0, Math.PI * 2); b.fill();
  }
  b.fillRect(0, 386, W, H);
  b.fillStyle = '#dde9f8';
  b.fillRect(0, 394, W, H);
})();

// ===== 그리기 =====
function drawBackground() {
  ctx.drawImage(bgCanvas, 0, 0);
  for (const f of flakes) circle(f.x, f.y, f.r, 'rgba(255,255,255,0.9)');
}

// 얼음 블록 벽
function tile(x, y, w, h, c) {
  ctx.fillStyle = c; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y, 1, h);
  ctx.fillStyle = 'rgba(60,80,140,0.3)'; ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x + w - 1, y, 1, h);
}
function drawWalls() {
  const c = WALL_COLORS[(level - 1) % WALL_COLORS.length];
  for (let x = 0; x < W; x += 12) tile(x, 22, 12, 8, c);
  for (let y = 30; y < H; y += 8) { tile(0, y, 12, 8, c); tile(RIGHT, y, 12, 8, c); }
  // 벽 위에 쌓인 눈
  ctx.fillStyle = '#ffffff';
  for (let x = 0; x < W; x += 8) { ctx.beginPath(); ctx.arc(x + 4, 23, 4, Math.PI, 0); ctx.fill(); }
}

function drawBrick(b) {
  ctx.lineWidth = 1;
  rr(b.x + 1, b.y + 2, b.w, b.h, 3, 'rgba(60,80,140,0.25)');        // 그림자
  rr(b.x, b.y, b.w, b.h, 3, b.color, '#5a6aa8');
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(b.x + 3, b.y + 5, b.w - 6, 1); // 반짝이
  ctx.fillStyle = 'rgba(60,80,140,0.15)'; ctx.fillRect(b.x + 2, b.y + b.h - 3, b.w - 4, 2);

  // 벽돌 위에 소복이 쌓인 눈
  rr(b.x - 1, b.y - 3, b.w + 2, 5, 3, '#ffffff');
  b.drip.forEach((dx, i) => circle(b.x + dx, b.y + 2, 1 + (i % 2) * 0.8, '#ffffff'));

  // 벽돌에도 귀여운 눈 (가끔 깜빡임)
  const ex = b.x + b.w / 2, ey = b.y + 7;
  ctx.fillStyle = OL;
  if ((frame + b.blink) % 240 < 6) {
    ctx.fillRect(ex - 5, ey + 1, 3, 1); ctx.fillRect(ex + 2, ey + 1, 3, 1);
  } else {
    ctx.fillRect(ex - 4, ey, 2, 3); ctx.fillRect(ex + 2, ey, 2, 3);
  }
}

// 공은 동글동글 눈뭉치
function drawBall(ball) {
  ball.trail.forEach((t, i) => circle(t.x, t.y, 1 + i * 0.4, `rgba(255,255,255,${0.15 + i * 0.1})`));
  ctx.lineWidth = 1;
  circle(ball.x, ball.y, BALL_R, '#ffffff', '#5a6aa8');
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R - 1.5, 0.2, Math.PI * 0.9);
  ctx.strokeStyle = '#bcd3f0'; ctx.stroke();       // 아래쪽 그늘
  circle(ball.x - 1.8, ball.y - 1.8, 1.2, '#eaf4ff');
}

// 아이템은 색깔 방울 (초록: 양쪽 화살표 / 노랑: 작은 공 두 개)
function drawItem(it) {
  const x = it.x, y = it.y + Math.sin(it.t * 0.15);
  ctx.lineWidth = 1;
  circle(x, y, 7, it.type === 'long' ? '#7ee07e' : '#ffe35c', OL);
  if (it.type === 'long') {
    ctx.fillStyle = OL;
    ctx.fillRect(x - 4, y, 9, 1);
    ctx.fillRect(x - 3, y - 1, 1, 3); ctx.fillRect(x + 3, y - 1, 1, 3);
  } else {
    circle(x - 2, y + 1, 2, '#fff', OL);
    circle(x + 2.5, y - 1.5, 2, '#fff', OL);
  }
  circle(x - 3, y - 4, 1.2, '#fff');  // 방울 반짝이
}

// 흰 족제비 그리기 (몸통이 길쭉해서 벽돌깨기 받침대로 딱!)
function drawFerret(x, y, w, face, mood, moving, squish, lookX) {
  const h = w / 2;
  ctx.save();
  ctx.translate(x, y);
  oval(0, 15, h + 6, 3, 'rgba(60,80,140,0.18)');  // 눈 위에 생기는 그림자
  // 공을 받으면 살짝 찌그러짐
  const sq = squish / 8;
  ctx.translate(0, 13); ctx.scale(1 + sq * 0.08, 1 - sq * 0.2); ctx.translate(0, -13);
  if (face < 0) ctx.scale(-1, 1);
  ctx.lineWidth = 1;

  // 꼬리 (끝이 까만 게 흰 족제비의 특징!)
  ctx.save();
  ctx.translate(-h + 2, 6);
  ctx.rotate(Math.sin(frame * 0.15) * 0.25 - 0.15);
  oval(-9, 0, 10, 3.5, '#fff', OL);
  oval(-17, 0, 4, 3, '#3a3350');
  ctx.restore();

  // 짧은 다리 네 개 (걸을 때 콩콩)
  [-h + 6, -h + 14, h - 18, h - 10].forEach((lx, i) => {
    const lift = moving ? Math.max(0, Math.sin(ferret.step + i * 1.6)) * 2 : 0;
    rr(lx, 10 - lift, 5, 5, 2, '#fff', OL);
  });

  // 몸통
  rr(-h, 0, w, 13, 6, '#fff', OL);
  rr(-h + 4, 8, w - 14, 3, 1.5, '#e9e6f7');

  // 머리
  const hx = h - 3, hy = 2;
  circle(hx - 7, hy - 7, 3.5, '#fff', OL); circle(hx - 7, hy - 7, 1.8, '#ffb3c8');
  circle(hx + 7, hy - 7, 3.5, '#fff', OL); circle(hx + 7, hy - 7, 1.8, '#ffb3c8');
  oval(hx, hy, 11, 8.5, '#fff', OL);
  oval(hx - 7, hy + 3, 2.5, 1.5, 'rgba(255,140,170,0.6)'); // 볼터치
  oval(hx + 7, hy + 3, 2.5, 1.5, 'rgba(255,140,170,0.6)');

  // 눈 (공 쪽을 살짝 쳐다봄)
  ctx.strokeStyle = OL; ctx.fillStyle = OL;
  const look = clamp((lookX - x) / 80, -1, 1) * face;
  [hx - 4.5, hx + 4.5].forEach((ex, i) => {
    ctx.beginPath();
    if (mood === 'happy') {          // ^ ^
      ctx.arc(ex, hy + 1, 1.8, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    } else if (mood === 'sad') {     // > <
      const d = i === 0 ? 1 : -1;
      ctx.moveTo(ex - 1.5 * d, hy - 2); ctx.lineTo(ex + 1.5 * d, hy); ctx.lineTo(ex - 1.5 * d, hy + 2); ctx.stroke();
    } else if (frame % 200 < 6) {    // 깜빡
      ctx.moveTo(ex - 1.5, hy); ctx.lineTo(ex + 1.5, hy); ctx.stroke();
    } else {
      circle(ex + look, hy, 1.7, OL);
      ctx.fillStyle = '#fff'; ctx.fillRect(ex + look - 1, hy - 1, 1, 1); ctx.fillStyle = OL;
    }
  });

  // 코, 입, 수염
  oval(hx, hy + 3, 1.6, 1.1, '#ff8fb1');
  ctx.strokeStyle = OL;
  ctx.beginPath();
  ctx.moveTo(hx - 2, hy + 5); ctx.quadraticCurveTo(hx - 1, hy + 6.5, hx, hy + 5);
  ctx.quadraticCurveTo(hx + 1, hy + 6.5, hx + 2, hy + 5);
  ctx.stroke();
  ctx.strokeStyle = '#a9a3c9';
  ctx.beginPath();
  ctx.moveTo(hx - 6, hy + 4); ctx.lineTo(hx - 13, hy + 3);
  ctx.moveTo(hx - 6, hy + 5); ctx.lineTo(hx - 12, hy + 6);
  ctx.moveTo(hx + 6, hy + 4); ctx.lineTo(hx + 13, hy + 3);
  ctx.moveTo(hx + 6, hy + 5); ctx.lineTo(hx + 12, hy + 6);
  ctx.stroke();
  ctx.restore();
}

// 화면 위쪽: 점수, 레벨, 목숨(하트)
function drawHUD() {
  ctx.fillStyle = '#4a5f9e';
  ctx.fillRect(0, 0, W, 22);
  text('점수 ' + String(score).padStart(5, '0'), 6, 11, 11, '#fff', 'left');
  text('LV ' + level, W / 2 + 10, 11, 11, '#ffe35c');
  for (let i = 0; i < START_LIVES; i++) {
    heart(W - 12 - i * 13, 11, 4.5, i < lives ? '#ff6fa8' : '#8090c0');  // 잃은 목숨은 흐린 하트
  }
}

function drawTitle() {
  rainbow('흰 족제비', W / 2, 80);
  rainbow('벽돌깨기!', W / 2, 108);
  text('WHITE FERRET BREAKOUT', W / 2, 134, 11, '#ffffff');

  // 눈밭을 왔다 갔다 하는 큰 족제비
  const fx = W / 2 + Math.sin(frame * 0.02) * 60;
  const face = Math.cos(frame * 0.02) >= 0 ? 1 : -1;
  ferret.step += 0.3;
  ctx.save();
  ctx.translate(fx, 205);
  ctx.scale(2, 2);
  drawFerret(0, 0, FERRET_W, face, 'normal', true, 0, 0);
  ctx.restore();
  // 머리 위에서 통통 튀는 눈뭉치
  drawBall({ x: fx, y: 175 - Math.abs(Math.sin(frame * 0.08)) * 30, trail: [] });

  text('최고 점수 ' + best, W / 2, 324, 11, '#ffe35c');
  ctx.lineWidth = 1;
  circle(W / 2 - 92, 350, 6, '#7ee07e', OL);
  text('족제비가 길어져요', W / 2 - 80, 350, 11, '#fff', 'left');
  circle(W / 2 + 34, 350, 6, '#ffe35c', OL);
  text('공 추가', W / 2 + 46, 350, 11, '#fff', 'left');
}

function draw() {
  drawBackground();
  drawWalls();
  drawHUD();

  if (state === 'title') { drawTitle(); return; }

  bricks.forEach(drawBrick);
  items.forEach(drawItem);
  const lookX = balls.length ? balls[0].x : ferret.x;
  drawFerret(ferret.x, ferret.y, ferret.w, ferret.face, ferret.mood, Math.abs(ferret.vx) > 0.3, ferret.squish, lookX);
  if (state === 'ready' || state === 'play') balls.forEach(drawBall);

  for (const p of parts) {
    if (p.flake) {
      circle(p.x, p.y, p.size, 'rgba(255,255,255,0.95)');
    } else if (p.snow) {
      // 눈 조각: 하늘색 그림자를 살짝 깔아서 잘 보이게
      ctx.fillStyle = '#9fb8e0'; ctx.fillRect((p.x | 0) + 1, (p.y | 0) + 1, p.size, p.size);
      ctx.fillStyle = p.color;   ctx.fillRect(p.x | 0, p.y | 0, p.size, p.size);
    } else {
      ctx.fillStyle = p.color; ctx.fillRect(p.x | 0, p.y | 0, p.size, p.size);
    }
  }
  for (const p of pops) text(p.text, p.x, p.y, 11, p.color);

  if (state === 'ready') {
    rainbow('레벨 ' + level, W / 2, 220);
    text('준비~!', W / 2, 250, 11);
  } else if (state === 'dead') {
    text('앗! 남은 목숨 ' + lives + '개', W / 2, 230, 11, '#ff8fc8');
  } else if (state === 'clear') {
    ctx.fillStyle = 'rgba(60,80,150,0.3)';
    ctx.fillRect(0, 22, W, H);
    rainbow('클리어!', W / 2, 170, 33);
    text('다음 레벨로~ 공이 조금 더 빨라져요!', W / 2, 215, 11, '#fff');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(50,65,130,0.5)';
    ctx.fillRect(0, 22, W, H);
    text('게임 오버', W / 2, 140, 33, '#ff6f8f');
    text('레벨 ' + level, W / 2, 178, 11, '#fff');
    text('이번 점수  ' + score, W / 2, 198, 11, '#fff');
    text('최고 점수  ' + best, W / 2, 218, 11, '#ffe35c');
    if (newRecord) rainbow('새 기록!', W / 2, 240, 11);
  }

  if (paused) {
    ctx.fillStyle = 'rgba(50,65,130,0.6)';
    ctx.fillRect(0, 0, W, H);
    rainbow('잠깐 쉬는 중~', W / 2, 190);
    text('P 또는 클릭으로 계속하기', W / 2, 225, 11);
  }
}

// ===== 게임 반복 (어떤 모니터에서도 1초에 60번 계산) =====
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last);
  last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
